
name: Build Mod - Forge 1.12.2

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '**.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'src/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Extrair projeto ZIP, se necessário
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace

          if [ -f gradlew ]; then
            cp -a . workspace/
          else
            zipfile=$(find . -maxdepth 2 -type f \
              -iname '*.zip' -print -quit)

            if [ -z "$zipfile" ]; then
              echo "::error::Nenhum projeto Gradle ou ZIP encontrado."
              exit 1
            fi

            unzip -q "$zipfile" -d workspace
          fi

          find workspace -name gradlew -type f -print

      - name: Localizar projeto Gradle
        id: project
        shell: bash
        run: |
          set -euo pipefail

          wrapper=$(find workspace -name gradlew \
            -type f -print -quit)

          if [ -z "$wrapper" ]; then
            echo "::error::ZIP sem gradlew. É necessário preparar o projeto Gradle Forge."
            exit 1
          fi

          echo "dir=$(dirname "$wrapper")" >> "$GITHUB_OUTPUT"

      - name: Compilar com Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.12.2-mod
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
